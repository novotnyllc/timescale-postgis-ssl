name: Docker Image CI/CD for timescale + postgis image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.pg18-ts2.26
      - init-extensions.sql
      - init-ssl.sh
      - wrapper.sh
      - .github/workflows/build.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.pg18-ts2.26
      - init-extensions.sql
      - init-ssl.sh
      - wrapper.sh
      - .github/workflows/build.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        dockerfile:
          [
            "Dockerfile.pg18-ts2.26",
          ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile name
        id: extract_version
        run: |
          version="${{ matrix.dockerfile }}"
          version="${version#Dockerfile.}" # Remove "Dockerfile." prefix if it exists
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and Publish
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.extract_version.outputs.version }}
